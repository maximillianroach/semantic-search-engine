services:
  meilisearch:
    image: getmeili/meilisearch:latest
    ports:
      - "7700:7700"
    volumes:
      - ./meili_data:/meili_data
    environment:
      - MEILI_NO_ANALYTICS=true

  data-service:
    build: ./data
    ports:
      - "5001:5001"
    volumes:
      - ./data/chroma_db:/app/chroma_db
      - ./data/artworks.db:/app/artworks.db
      - ./images:/app/images
    environment:
      - CHROMA_PATH=/app/chroma_db
      - MEILI_URL=http://meilisearch:7700
    depends_on:
      - meilisearch

  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./images:/app/images
    environment:
      - FASTAPI_URL=http://data-service:5001
    depends_on:
      - data-service
